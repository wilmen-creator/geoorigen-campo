name: Latido diario (anti pausa de Supabase)

# El plan gratis de Supabase pausa el proyecto tras unos días sin actividad, y solo
# leer no basta. Cada día esta tarea llama a public.latido(), que ESCRIBE en la base
# (fecha y contador en app.latidos; migración 13). Usa la llave pública de la app.

on:
  schedule:
    - cron: '0 12 * * *'   # 7:00 a. m. en Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Escribir el latido en la base
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          LLAVE: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$LLAVE" ]; then echo "::error::Faltan VITE_SUPABASE_URL o VITE_SUPABASE_ANON_KEY"; exit 1; fi
          # Hasta 3 intentos por si la red falla un momento
          for intento in 1 2 3; do
            respuesta=$(curl -s -w '\n%{http_code}' -X POST "$URL/rest/v1/rpc/latido" \
              -H "apikey: $LLAVE" -H "Content-Type: application/json" -d '{}')
            codigo=$(echo "$respuesta" | tail -1)
            if [ "$codigo" = "200" ]; then echo "Latido registrado: $(echo "$respuesta" | head -1)"; exit 0; fi
            echo "Intento $intento: HTTP $codigo $(echo "$respuesta" | head -1)"
            sleep 20
          done
          echo "::error::No se pudo registrar el latido. ¿Está pausado el proyecto en Supabase?"
          exit 1
