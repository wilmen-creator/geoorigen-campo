name: Publicar APK

# Se publica una versión creando una etiqueta, por ejemplo:  git tag v2.0.1 && git push origin v2.0.1
# El APK queda firmado con la llave fija de GeoOrigen y con un enlace público
# en GitHub Releases (no vence y no pide cuenta de GitHub para descargarlo).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Versión desde la etiqueta
        id: version
        run: |
          NOMBRE="${GITHUB_REF_NAME#v}"
          # Número siempre creciente: 100 + número de publicación
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "codigo=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Comprobar secretos de firma
        env:
          LLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Sin la llave fija no se publica (las actualizaciones no se podrían instalar encima)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del motor
        run: npm test

      - name: Compilar la app web
        run: |
          npm pkg set version=${{ steps.version.outputs.nombre }} -w @geoorigen/app
          npm run build:app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sincronizar Capacitor
        run: npx cap sync android
        working-directory: apps/app

      - name: Android SDK 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Compilar APK firmado
        working-directory: apps/app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/geoorigen-campo.p12
          LLAVE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.nombre }}
          APP_VERSION_CODE: ${{ steps.version.outputs.codigo }}
        run: |
          printf '%s' "$LLAVE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/GeoOrigen-Campo-${{ steps.version.outputs.nombre }}.apk"

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/GeoOrigen-Campo-${{ steps.version.outputs.nombre }}.apk"
          cp "$APK" "$RUNNER_TEMP/GeoOrigen-Campo.apk"
          gh release create "$GITHUB_REF_NAME" "$APK" "$RUNNER_TEMP/GeoOrigen-Campo.apk" \
            --title "GeoOrigen Campo ${{ steps.version.outputs.nombre }}" \
            --notes "Descarga **GeoOrigen-Campo.apk** e instálalo en el celular. Si ya tienes la app, se actualiza sin perder tus encuestas."
